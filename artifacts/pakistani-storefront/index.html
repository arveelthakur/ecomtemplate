    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;family=Noto+Nastaliq+Urdu&amp;display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <style id="nura-critical-css">
      *,*::before,*::after{box-sizing:border-box}
      html,body{width:100%;min-height:100%;margin:0;background:#fdfbf7;color:#352b2b;font-family:"DM Sans",Arial,sans-serif;-webkit-font-smoothing:antialiased}
      html{overflow-x:hidden}
      body{min-height:100vh;overflow-x:clip}
      button,input,select,textarea{font:inherit}
      img,svg,video{max-width:100%}
      #root{width:100%;min-height:100vh;max-width:100%;overflow-x:clip}
      #nura-preloader{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;padding:16px;background:#fdfbf7;opacity:1;visibility:visible;transition:opacity var(--nura-loader-fade,180ms) ease,visibility var(--nura-loader-fade,180ms) ease}
      .nura-loader-content{display:grid;width:min(100%,360px);min-width:0;justify-items:center;gap:15px;color:#6b2447}
      .nura-loader-logo{font-family:"Manrope","DM Sans",Arial,sans-serif;font-size:32px;font-weight:800;letter-spacing:-.08em;line-height:1}
      .nura-loader-logo::after{content:"";display:var(--nura-logo-dot-display,inline-block);width:.16em;height:.16em;margin-left:.06em;border-radius:var(--nura-logo-dot-radius,50%);background:var(--nura-logo-dot-color,#C6A15B);vertical-align:baseline;translate:0 0}
      .nura-loader-logo[data-dot-visible="false"]::after{display:none}
      .nura-loader-image{display:none;max-width:min(180px,100%);max-height:64px;object-fit:contain}
      .nura-loader-mark{position:relative;width:28px;height:28px;border:0;border-radius:50%}
      .nura-loader-mark::after{position:absolute;inset:0;border-radius:50%;background:#6b2447;content:"";animation:nura-loader-pulse 1.2s ease-in-out infinite}
      .nura-loader-message{max-width:100%;overflow-wrap:anywhere;text-align:center;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#7f746a}
      #nura-preloader[data-style="nura-pulse"] .nura-loader-logo{animation:nura-loader-pulse 1.7s ease-in-out infinite}
      #nura-preloader[data-style="minimal-spinner"] .nura-loader-mark{border:2px solid #eadfe3;border-top-color:#6b2447;animation:nura-loader-spin .8s linear infinite}
      #nura-preloader[data-style="minimal-spinner"] .nura-loader-mark::after{display:none}
      #nura-preloader[data-style="minimal-spinner"] .nura-loader-logo,
      #nura-preloader[data-style="minimal-spinner"] .nura-loader-image{display:none}
      #nura-preloader[data-style="store-logo"] .nura-loader-logo,
      #nura-preloader[data-style="store-logo"] .nura-loader-mark,
      #nura-preloader[data-style="favicon"] .nura-loader-logo,
      #nura-preloader[data-style="favicon"] .nura-loader-mark{display:none}
      #nura-preloader[data-style="store-logo"] .nura-loader-image,
      #nura-preloader[data-style="favicon"] .nura-loader-image{display:block}
      #nura-preloader[data-style="favicon"] .nura-loader-image{width:64px;height:64px;max-width:min(64px,100%);max-height:64px}
      @media (orientation:landscape){
        .nura-loader-image{max-height:min(64px,calc(100vh - 72px))}
        #nura-preloader[data-style="favicon"] .nura-loader-image{width:min(64px,calc(100vh - 72px),calc(100vw - 32px));height:min(64px,calc(100vh - 72px),calc(100vw - 32px))}
      }
      body.nura-app-loading{overflow:hidden}
      body.nura-app-loading.nura-preloader-disabled::before{position:fixed;inset:0;z-index:2147483000;background:#fdfbf7;content:""}
      body.nura-app-loading.nura-preloader-disabled #nura-preloader{display:none}
      body.nura-app-ready #nura-preloader{opacity:0;visibility:hidden;pointer-events:none}
      body.nura-app-ready #root{animation:nura-content-reveal .18s ease-out both}
      #nura-startup-fallback{display:none;max-width:min(360px,86vw);padding:28px;text-align:center;color:#352b2b}
      #nura-startup-fallback h1{margin:0;font-size:20px;line-height:1.25}
      #nura-startup-fallback p{margin:12px 0 0;font-size:13px;line-height:1.6;color:#766d64}
      #nura-startup-fallback button{min-height:44px;margin-top:20px;border:0;border-radius:999px;padding:0 22px;background:#6b2447;color:#fff;font-weight:600}
      body.nura-startup-failed #nura-preloader{opacity:1;visibility:visible;pointer-events:auto}
      body.nura-startup-failed #nura-loader-content{display:none}
      body.nura-startup-failed #nura-startup-fallback{display:block}
      body.nura-startup-failed.nura-preloader-disabled #nura-preloader{display:grid}
      @keyframes nura-loader-spin{to{transform:rotate(360deg)}}
      @keyframes nura-loader-pulse{0%,100%{transform:scale(.7);opacity:.45}50%{transform:scale(1);opacity:.9}}
      @keyframes nura-content-reveal{from{opacity:.985;transform:translateY(2px)}to{opacity:1;transform:translateY(0)}}
      .nura-loader-logo:empty{display:none}
      @media(prefers-reduced-motion:reduce){#nura-preloader,body.nura-app-ready #root{transition:none;animation:none}.nura-loader-mark,.nura-loader-mark::after,.nura-loader-logo{animation:none}}
    </style>
    <script id="nura-preloader-config" type="application/json">{"enabled":true,"style":"nura-pulse","loadingText":"Loading your store...","minimumDisplayMs":500,"storeLogoUrl":"","faviconUrl":"","storeName":"","storeSubtitle":"","logoDotColor":"#C6A15B","logoDotVisible":true,"logoDotShape":"circle","taglineColor":"#766D63"}</script>
    <script>
      (() => {
        let config = {};
        try {
          config = JSON.parse(document.getElementById('nura-preloader-config')?.textContent || '{}');
        } catch {}
        const applyBranding = branding => {
          const storeName = typeof branding?.storeName === 'string' ? branding.storeName.trim().slice(0, 120) : '';
          const storeSubtitle = typeof branding?.storeSubtitle === 'string' ? branding.storeSubtitle.trim().slice(0, 140) : '';
          const logoDotColor = typeof branding?.logoDotColor === 'string' && /^#[0-9a-f]{6}$/i.test(branding.logoDotColor) ? branding.logoDotColor : '#C6A15B';
          const logoDotVisible = branding?.logoDotVisible !== false;
    const logoDotShape = branding?.logoDotShape === 'square' ? 'square' : 'circle';
          const taglineColor = typeof branding?.taglineColor === 'string' && /^#[0-9a-f]{6}$/i.test(branding.taglineColor) ? branding.taglineColor : '#766D63';
          document.documentElement.style.setProperty('--nura-logo-dot-color', logoDotColor);
          document.documentElement.style.setProperty('--nura-logo-dot-display', logoDotVisible ? 'inline-block' : 'none');
    document.documentElement.style.setProperty('--nura-logo-dot-radius', logoDotShape === 'square' ? '0' : '50%');
          document.documentElement.style.setProperty('--nura-tagline-color', taglineColor);
          const logoText = document.querySelector('.nura-loader-logo');
          const message = document.querySelector('.nura-loader-message');
          const preloader = document.getElementById('nura-preloader');
          if (logoText) { logoText.textContent = storeName; logoText.hidden = !storeName; logoText.dataset.dotVisible = String(logoDotVisible); }
          if (message) message.textContent = storeSubtitle || (typeof config.loadingText === 'string' ? config.loadingText : 'Loading your store...');
          if (preloader) preloader.setAttribute('aria-label', [storeName, storeSubtitle].filter(Boolean).join(' — ') || storeSubtitle || config.loadingText || 'Loading your store...');
        };
        applyBranding(config);
        window.addEventListener('nura-storefront-brand-ready', event => applyBranding(event.detail || {}), { once: true });
        const minimumDisplayMs = Math.max(0, Math.min(1500, Number(config.minimumDisplayMs) || 500));
        const startupTimeoutMs = Math.max(2500, Math.min(20000, Number(config.startupTimeoutMs) || 5000));
        const startedAt = performance.now();
        let appMounted = false;
        let storefrontDataReady = config.waitForStorefrontData === false;
        let revealed = false;
        const delay = ms => new Promise(resolve => window.setTimeout(resolve, ms));
        const fallbackToBrandedPulse = loaderImage => {
          const preloader = document.getElementById('nura-preloader');
          if (!preloader || !loaderImage || loaderImage.dataset.fallbackApplied === 'true') return;
          loaderImage.dataset.fallbackApplied = 'true';
          preloader.dataset.style = 'nura-pulse';
          loaderImage.removeAttribute('src');
        };
        document.addEventListener('error', event => {
          const target = event.target;
          if (target instanceof HTMLImageElement && target.matches('.nura-loader-image')) {
            fallbackToBrandedPulse(target);
          }
        }, true);
        if (config.enabled === false) document.documentElement.classList.add('nura-preloader-disabled');
        const reveal = () => {
          if (revealed) return;
          revealed = true;
          window.clearTimeout(startupWatchdog);
          const loaderImage = document.querySelector('.nura-loader-image');
          if (loaderImage instanceof HTMLImageElement && loaderImage.getAttribute('src') && !loaderImage.complete) {
            loaderImage.removeAttribute('src');
          }
          document.body.classList.remove('nura-app-loading');
          document.body.classList.add('nura-app-ready');
          if (!document.body.classList.contains('nura-startup-failed')) {
            document.getElementById('nura-preloader')?.setAttribute('aria-hidden', 'true');
          }
        };
        const recoverStartup = () => {
          if (!appMounted && !document.getElementById('root')?.childElementCount) {
            document.body.classList.add('nura-startup-failed');
          }
          reveal();
        };
        const startupWatchdog = window.setTimeout(recoverStartup, startupTimeoutMs);
        const finishWhenReady = async () => {
          if (!appMounted || !storefrontDataReady || revealed) return;
          await delay(Math.max(0, minimumDisplayMs - (performance.now() - startedAt)));
          requestAnimationFrame(() => requestAnimationFrame(reveal));
        };
        window.addEventListener('nura-app-mounted', () => {
          appMounted = true;
          document.body.classList.remove('nura-startup-failed');
          if (revealed) document.getElementById('nura-preloader')?.setAttribute('aria-hidden', 'true');
          void finishWhenReady().catch(recoverStartup);
        }, { once: true });
        window.addEventListener('nura-storefront-data-ready', () => {
          storefrontDataReady = true;
          void finishWhenReady().catch(recoverStartup);
        }, { once: true });
        window.addEventListener('nura-startup-error', recoverStartup, { once: true });
        window.addEventListener('error', event => {
          if (appMounted) return;
          if (event.target === window || event.error || event.target instanceof HTMLScriptElement) recoverStartup();
        }, true);
        window.addEventListener('unhandledrejection', () => {
          if (!appMounted) recoverStartup();
        });
        document.getElementById('nura-reload-startup')?.addEventListener('click', () => window.location.reload());
        window.addEventListener('load', () => window.setTimeout(() => {
          if (!revealed) recoverStartup();
        }, startupTimeoutMs), { once: true });
      })();
    </script>
  </head>
  <body class="nura-app-loading">
    <div id="nura-preloader" data-style="nura-pulse" role="status" aria-live="polite" aria-label="Loading your store...">
      <div id="nura-loader-content" class="nura-loader-content">
        <div class="nura-loader-logo"></div>
        <img class="nura-loader-image" alt="" decoding="async" fetchpriority="high">
        <div class="nura-loader-mark" aria-hidden="true"></div>
        <div class="nura-loader-message">Loading your store...</div>
      </div>
      <div id="nura-startup-fallback" role="alert">
        <h1>The storefront is taking longer than expected</h1>
        <p>Check your connection and try loading the store again.</p>
        <button id="nura-reload-startup" type="button">Reload storefront</button>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
